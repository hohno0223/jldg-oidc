# Trusted Bash settings, installed root-owned as /etc/oidc-agent/jldg-auth.conf.
# Options apply to both registration and reauthentication.
JLDG_CLIENT_CONFIG=${JLDG_CLIENT_CONFIG:-/etc/oidc-agent/jldg-client.json}
JLDG_GEN_OPTIONS=(
    --pub --prompt=none --pw-prompt=cli --confirm-default
    --flow=code --no-scheme --no-url-call
)
